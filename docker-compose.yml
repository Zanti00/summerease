services:
  db:
    image: pgvector/pgvector:pg16
    container_name: summerease_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: summerease_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nexusauth:
    build:
      context: ../NexusAuth
      dockerfile: Dockerfile
    container_name: summerease_nexusauth
    ports:
      - "3001:3001"
    env_file:
      - ../NexusAuth/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:admin@db:5432/NexusAuth
      - REDIS_URL=redis://redis:6379
      - JWT_PRIVATE_KEY_PATH=./keys/private.pem
      - JWT_PUBLIC_KEY_PATH=./keys/public.pem
      - JWT_ACCESS_TOKEN_TTL=900
      - JWT_REFRESH_TOKEN_TTL=604800
      - MFA_ENCRYPTION_KEY=C9AA958E07E825C131D6877A1986597C5E4AAB2B79EE21C1621361AFD0060FF7
      - RATE_LIMIT_LOGIN_MAX=10
      - RATE_LIMIT_LOGIN_WINDOW_MS=900000
      - SMTP_HOST=sandbox.smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=6c2de7c8087b68
      - SMTP_PASS=6fa9db29a60ef7
      - SMTP_FROM=NexusAuth
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  services:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: summerease_services
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@db:5432/summerease
      - SECRET_KEY=your-secret-key-here
      - ENVIRONMENT=development
      - NEXUSAUTH_BASE_URL=http://nexusauth:3001
      - NEXUSAUTH_API_KEY=dummy_key
      - SUPABASE_URL=https://jmzggeqgwetftsyffcyn.supabase.co
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptemdnZXFnd2V0ZnRzeWZmY3luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzExNTYsImV4cCI6MjA5NTIwNzE1Nn0.pXp0fTYeWn9sAPJb-3g7CJdwYYEmtgE07E60lJF1WTQ
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_TOOL_MODEL=gemini-2.5-flash
      - EMBEDDING_MODEL=gemini-embedding-2
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_TIMEOUT_SECONDS=120
      - LLM_MAX_CONTEXT_TOKENS=2048
      - LLM_MAX_OUTPUT_TOKENS=512
      - LLM_TEMPERATURE=0.1
      - LLM_TOP_K_CHUNKS=5
    depends_on:
      db:
        condition: service_healthy
      nexusauth:
        condition: service_started

  rq_worker:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: summerease_rq_worker
    command: rq worker documents_autosave --url redis://redis:6379
    volumes:
      - ./services:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@db:5432/summerease
      - SUPABASE_URL=https://jmzggeqgwetftsyffcyn.supabase.co
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptemdnZXFnd2V0ZnRzeWZmY3luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzExNTYsImV4cCI6MjA5NTIwNzE1Nn0.pXp0fTYeWn9sAPJb-3g7CJdwYYEmtgE07E60lJF1WTQ
      - NEXUSAUTH_BASE_URL=http://nexusauth:3001
      - NEXUSAUTH_API_KEY=dummy_key
    depends_on:
      - redis
      - db

  clamav:
    image: clamav/clamav:latest
    container_name: summerease_clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  rq_worker_rag:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: summerease_rq_worker_rag
    command: rq worker rag_processing --url redis://redis:6379
    volumes:
      - ./services:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@db:5432/summerease
      - SUPABASE_URL=https://jmzggeqgwetftsyffcyn.supabase.co
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptemdnZXFnd2V0ZnRzeWZmY3luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzExNTYsImV4cCI6MjA5NTIwNzE1Nn0.pXp0fTYeWn9sAPJb-3g7CJdwYYEmtgE07E60lJF1WTQ
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EMBEDDING_MODEL=gemini-embedding-2
      - NEXUSAUTH_BASE_URL=http://nexusauth:3001
      - NEXUSAUTH_API_KEY=dummy_key
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: summerease_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

